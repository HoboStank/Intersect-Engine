<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Intersect Web Proxy Test</title>
  </head>
  <body>
    <h1>Intersect Web Proxy Test</h1>
    <p>Status: <span id="status">disconnected</span></p>
    <button id="connect">Connect</button>
    <button id="send" disabled>Send Hail (raw)</button>
    <pre id="log"></pre>

    <script>
      let ws;
      const log = (s) => { document.getElementById('log').textContent += s + '\n'; };

      document.getElementById('connect').onclick = () => {
        ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => { document.getElementById('status').textContent = 'open'; document.getElementById('send').disabled = false; log('WS open'); };
        ws.onmessage = (e) => { const a = new Uint8Array(e.data); log('RX ' + a.length + ' bytes: ' + Array.from(a.slice(0,32)).map(b=>b.toString(16).padStart(2,'0')).join(' ')); };
        ws.onclose = () => { document.getElementById('status').textContent = 'closed'; log('WS closed'); };
      };

      document.getElementById('send').onclick = () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        // Send a small test packet (replace with properly formatted hail packet if you have one)
        const payload = new Uint8Array([0x01,0x02,0x03,0x04]);
        ws.send(payload);
        log('TX ' + payload.length + ' bytes');
      };
    </script>
  </body>
</html>
